# Publish one prebuilt .vsix to the VS Code Marketplace with trusted publishing (GitHub OIDC, no PAT).
# The Marketplace policy on publisher "zovo" names this repository and the file name "publish.yml".
# Renaming this file or the repository breaks publishing until the policy is updated.
#
# Input: the tag of a release in this repo. The release must carry exactly one .vsix asset and
# the tag must be "<extension name>-v<version>" (for example "tensor-viewer-v0.1.4").
# Runs only by workflow_dispatch (scripts/publish_all.sh in the factory starts it), so no "paths:" block.
name: Publish VSIX
run-name: publish ${{ inputs.release }}

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release tag in this repo, for example tensor-viewer-v0.1.4'
        required: true

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.release }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE: ${{ inputs.release }}
      GH_TOKEN: ${{ github.token }}
      VSCE: '@vscode/vsce@4.1.0'
      PUBLISHER: zovo
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download the .vsix from the release
        run: |
          set -e
          mkdir -p out
          gh release download "$RELEASE" --repo "$GITHUB_REPOSITORY" --pattern '*.vsix' --dir out
          ls -la out
          [ "$(find out -name '*.vsix' | wc -l)" = 1 ] || { echo "The release must have exactly one .vsix asset"; exit 1; }
          VSIX=$(find out -name '*.vsix')
          sha256sum "$VSIX"
          echo "VSIX=$VSIX" >> "$GITHUB_ENV"

      - name: Check publisher, name and version against the tag
        run: |
          unzip -p "$VSIX" extension/package.json > "$RUNNER_TEMP/vsix-package.json"
          node -e '
            const v = require(process.argv[1]);
            const fail = (m) => { console.error(m); process.exit(1); };
            if (v.publisher !== process.env.PUBLISHER) fail(`publisher ${v.publisher} is not ${process.env.PUBLISHER}`);
            const want = `${v.name}-v${v.version}`;
            if (process.env.RELEASE !== want) fail(`release tag ${process.env.RELEASE} must be ${want}`);
            console.log(`OK ${v.publisher}.${v.name} ${v.version}`);
          ' "$RUNNER_TEMP/vsix-package.json"

      - name: Publish with trusted publishing (OIDC)
        run: npx -y "$VSCE" publish --oidc --packagePath "$VSIX" --skip-duplicate
